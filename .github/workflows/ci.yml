name: CI

on:
  push:
  pull_request:

jobs:
  lint-typecheck-unit:
    name: Lint, typecheck, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck the web app
        run: npm run check-types --workspace @scraper/web

      # Type-aware lint rules need packages/db and packages/shared already
      # built (tsc -b, above), or they cannot resolve @scraper/db and
      # @scraper/shared types and misreport unrelated unsafe-* errors.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  integration:
    name: Integration and end-to-end tests
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scraper_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scraper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 59000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Integration and end-to-end tests
        env:
          INTEGRATION_REQUIRED: '1'
        run: npm run test:integration
